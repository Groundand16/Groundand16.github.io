<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligue · Ground &amp; Pound</title>
<meta name="description" content="Rejoins ma ligue de pronostics MMA sur Ground &amp; Pound.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="Rejoins ma ligue sur Ground &amp; Pound">
<meta property="og:description" content="Pronostique les combats de MMA et grimpe au classement de la ligue.">
<meta property="og:image" content="https://groundand16.github.io/icon.png">
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background: linear-gradient(#3d070b, #070707 55%); color: #ededf0; text-align: center;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { width: 100%; max-width: 400px; }
img { width: 112px; height: 112px; }
h1 { font-size: 26px; line-height: 1.25; margin: 20px 0 8px; overflow-wrap: anywhere; }
p { color: #b5b5bb; margin: 0 0 24px; }
a.button { display: block; padding: 16px; border-radius: 12px; font-weight: 700; text-decoration: none; margin-bottom: 12px; }
a.main { background: #ff1f2d; color: #fff; }
a.store { border: 1px solid rgba(255, 255, 255, .25); color: #fff; }
small { display: block; color: #8a8a92; margin-top: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="">
  <h1 id="title">Rejoins ma ligue sur Ground &amp; Pound</h1>
  <p id="text">Pronostique les combats de MMA et grimpe au classement de la ligue.</p>
  <a class="button main" id="open" hidden>Rejoindre la ligue</a>
  <a class="button store" href="https://apps.apple.com/fr/app/ground-pound/id6837472050">Télécharger l'appli (gratuite)</a>
  <small id="hint">Pas encore l'appli ? Télécharge-la, crée ton compte, puis reviens toucher « Rejoindre la ligue ».</small>
</main>
<script>
// L'adresse contient le code de la ligue (c) et son nom (n). Rien n'est envoyé ni enregistré ici.
var params = new URLSearchParams(location.search);
var code = (params.get('c') || '').toLowerCase();
var name = (params.get('n') || '').replace(/\s+/g, ' ').trim().slice(0, 30);
if (/^[0-9a-f]{16}$/.test(code)) {
  var open = document.getElementById('open');
  open.href = 'groundandpound://ligue/' + code;
  open.hidden = false;
  if (name.length >= 3) document.getElementById('title').textContent = 'Rejoins la ligue « ' + name + ' »';
} else {
  document.getElementById('text').textContent = 'Ce lien de ligue est incomplet : demandes-en un nouveau.';
  document.getElementById('hint').hidden = true;
}
</script>
</body>
</html>
